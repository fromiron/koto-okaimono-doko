name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATASET_BASE_URL: https://fromiron.github.io/koto-okaimono-doko
      EXPO_PUBLIC_DATASET_MANIFEST_URL: https://fromiron.github.io/koto-okaimono-doko/manifest.json
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # pnpm/action-setup@v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.2

      # actions/setup-node@v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm

      # actions/setup-java@v4
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'

      # actions/cache@v4 — Gradle cache
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - run: pnpm install --frozen-lockfile

      - name: Build dataset (seed)
        run: pnpm dataset:build
        timeout-minutes: 45

      - name: Expo prebuild (Android)
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        id: apk
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          APK_SRC=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          APK_NAME="koto-okaimono-doko-${TAG}.apk"
          cp "$APK_SRC" "$APK_NAME"
          echo "path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      # actions/upload-artifact@v7 — always upload as build artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: env.ACT != 'true'
        with:
          name: apk-release
          path: ${{ steps.apk.outputs.path }}

      # softprops/action-gh-release@v2 — create GitHub Release on tag push
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.ACT != 'true'
        # softprops/action-gh-release@v2.6.2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
